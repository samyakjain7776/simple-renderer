spring.application.name=simple-renderer
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

renderer.staging-directory=${java.io.tmpdir}/simple-renderer
renderer.max-input-bytes=104857600
renderer.max-output-bytes=104857600
renderer.max-rows=1000000
renderer.max-concurrent-reports=2
renderer.worker-threads=4
renderer.chunk-size=500
renderer.max-chunk-characters=262144
renderer.max-in-flight-chunks=4
